[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 180
timeout_method = thread
faulthandler_timeout = 185
markers =
    live: live DB / LLM integration (longer budget)
    both_integration: exercises nested both paths (no global stub)
    groupchat_legacy: groupchat state_transition tests (RUN_GROUPCHAT_TESTS=1)